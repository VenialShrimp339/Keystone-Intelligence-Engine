source: "The Minto Pyramid Principle"
artifact_type: eval_candidates
copyright_policy: "Prompts and rubrics are paraphrased or newly constructed from derived methodology."
candidates:
  - id: minto_eval_001_billing_process_change
    type: book_derived
    visible_prompt: "A large customer asks to replace a supplier's normal billing cycle with a monthly payment plus electronic ticket file generated by the customer. The accounting head must advise whether to accept the change. Build a senior-consultant-quality issue tree, including a pruned decision tree and evidence requirements."
    hidden_reference_logic: "Frame the question as whether to accept the proposed process change. Top branches should be reasons the change is or is not sound: information/control adequacy, cash/economic impact, workload impact, and implementation risk. Process mechanics belong under those branches."
    hidden_property_rubric:
      - "States the governing yes/no decision question."
      - "Uses reasons or criteria as top branches rather than process steps."
      - "Includes data/control completeness as a required branch."
      - "Includes cash timing and workload impact as benefits to test."
      - "Attaches evidence such as required fields, reconciliation controls, cycle-time impact, and exception rate."
      - "Prunes by identifying the few tests that could overturn acceptance."
    common_traps:
      - "Describes the old and new process without recommendation logic."
      - "Assumes customer convenience is sufficient."
      - "Mixes implementation tasks and decision criteria at the same level."
    grading_rule: "Score for branch logic, decision relevance, and evidence-test quality, not exact labels."

  - id: minto_eval_002_distribution_capacity_strategy
    type: book_derived
    visible_prompt: "A retailer's distribution capacity will run short within two years. Options include expanding current sites, building another site, improving handling productivity, and using third parties. Management wants enough capacity at the lowest capital and operating cost without breaking the full-line service model. Build the issue tree."
    hidden_reference_logic: "This is an alternative-selection problem. The tree should derive decision criteria from R2 and constraints, then evaluate options against capacity, economics, operating model, timing, and reversibility."
    hidden_property_rubric:
      - "Defines R1 as future capacity shortage and R2 as sufficient capacity with cost and service constraints."
      - "Recognizes the live alternatives and chooses a criteria-based comparison."
      - "Separates capital cost, operating cost, service continuity, and execution timing."
      - "Includes staged or trigger-based capacity as a pruning insight."
      - "Specifies evidence needed for each option: forecast demand, throughput, capex, opex, service levels, lead times."
    common_traps:
      - "Defaults to building a new warehouse."
      - "Lists options without decision criteria."
      - "Ignores third-party capacity or material-handling productivity as option-value levers."
    grading_rule: "Reward decision criteria grounded in the problem frame and explicit pruning logic."

  - id: minto_eval_003_sales_growth_gap
    type: book_derived
    visible_prompt: "A company with a long-stable sales process expects sales to decline rather than continue growing. The process has three simple stages: prospect list, sales script, and pitch delivery. Build a diagnostic tree and a first-pass research plan."
    hidden_reference_logic: "The diagnostic tree should be derived from the process that produced the prior result. Branches should test prospect universe, message, and delivery before proposing fixes."
    hidden_property_rubric:
      - "States current undesired result and desired result."
      - "Uses the known sales process as the primary decomposition axis."
      - "Creates yes/no tests under each process component."
      - "Distinguishes diagnosis from solution."
      - "Prunes by testing high-discrimination process stages first."
    common_traps:
      - "Generic market analysis unmoored from the known process."
      - "Premature recommendations."
      - "No evidence requirements."
    grading_rule: "Score for process-derived diagnosis and clean research tests."

  - id: minto_eval_004_production_system_growth_readiness
    type: book_derived
    visible_prompt: "A manufacturing division is growing faster than expected, but its new planning and control systems are not reliably supporting orders, parts availability, scheduling, and shop-floor execution. Management wants to know how to make production capability and support productivity handle growth. Build the analysis structure."
    hidden_reference_logic: "A good answer maps the operating system before listing data. Branches should follow the production planning/control flow and generate yes/no questions around lead times, purchased items, stock, capacity, dispatching, user adoption, and reports."
    hidden_property_rubric:
      - "Builds a diagnostic framework, not a data inventory."
      - "Shows relevant operating flow or system components."
      - "Frames branches as possible failure locations."
      - "Specifies what data would confirm or exclude each cause."
      - "Recognizes upstream dependencies before downstream symptoms."
    common_traps:
      - "Treats training as the sole cause."
      - "Organizes by interview topics."
      - "Omits capacity or materials availability."
    grading_rule: "Reward visible system representation and testable issue formulation."

  - id: minto_eval_005_inventory_investment
    type: book_derived
    visible_prompt: "A distributor's central warehouse ties up more capital than new owners think is necessary. Regional warehouses sometimes bypass the center because of stock-outs. The company wants to reduce inventory investment while maintaining service. Build the issue tree and pruning logic."
    hidden_reference_logic: "First establish the right inventory level. Then diagnose excess through ordering, holding, item mix, service requirements, and network design. Preserve service as a constraint."
    hidden_property_rubric:
      - "Converts 'too high' into a test against required service-level inventory."
      - "Separates target-setting from root-cause diagnosis."
      - "Includes stock-outs and regional direct ordering as symptoms that may raise total inventory."
      - "Includes obsolete or slow-moving inventory."
      - "Includes central versus regional economics where relevant."
      - "Attaches evidence to each branch."
    common_traps:
      - "Cuts inventory without preserving service."
      - "Assumes regional bypass is simply bad behavior."
      - "Fails to define the desired result numerically or operationally."
    grading_rule: "Score for causal clarity and service-constrained decision logic."

  - id: minto_eval_006_energy_cost_driver_tree
    type: book_derived
    visible_prompt: "A factory wants an energy-cost reduction strategy. Candidate topics include operating practices, low-capital engineering, major capital projects, fuel mix, sourcing, government incentives, organization, and product-to-mill assignments. Build a clean full tree and a pruned decision tree."
    hidden_reference_logic: "The core driver split is energy units consumed versus cost per unit. Initiatives should sit under those levers. Organization and incentives are enablers unless they directly affect the driver."
    hidden_property_rubric:
      - "Uses a cost-driver root split."
      - "Places initiatives under consumption reduction, unit-cost reduction, or enablers."
      - "Identifies off-axis topics and either nests or defers them."
      - "Prioritizes branches by savings potential, capital required, risk, and speed."
      - "Includes evidence requirements such as usage baselines, tariffs, fuel feasibility, capex, and operating constraints."
    common_traps:
      - "Lists all topics as peer issues."
      - "Makes strategy a content-free branch."
      - "Ignores the distinction between operating changes and capital changes."
    grading_rule: "Reward driver logic and explicit deferral of secondary branches."

  - id: minto_eval_007_public_company_margin_decline
    type: novel_stress_test
    visible_prompt: "A public company's gross margin fell by 420 basis points year over year while revenue grew 18%. Management says the decline is temporary and driven by mix. Build an issue tree for an investor diligence team, including a pruned research plan and evidence requirements."
    hidden_reference_logic: "Frame as whether the margin decline is temporary, mix-driven, and non-structural. Use a financial driver tree: price, volume/mix, input cost, production efficiency, channel/customer terms, accounting/classification. Prune toward branches that can falsify management's claim."
    hidden_property_rubric:
      - "States the decision question in investor terms."
      - "Uses gross margin driver logic."
      - "Separates mix from price and cost."
      - "Includes evidence from segment margins, customer/channel mix, input costs, utilization, and disclosures."
      - "Prioritizes tests that disprove the management explanation."
    common_traps:
      - "Generic SWOT."
      - "Accepts management's explanation as a branch conclusion."
      - "No falsification tests."
    grading_rule: "Score for hypothesis testing and source-of-margin decomposition."

  - id: minto_eval_008_llm_architecture_latency
    type: novel_stress_test
    visible_prompt: "An LLM application meets quality targets but p95 latency is too high for production. The team can change model choice, prompt length, retrieval design, batching, caching, streaming, or infrastructure. Build an issue tree for diagnosis and recommendation."
    hidden_reference_logic: "Separate diagnostic tree from solution tree. Diagnose latency through model inference, prompt/context size, retrieval/tool calls, orchestration, network/infrastructure, and concurrency. Recommend changes by impact on latency, quality, cost, and implementation risk."
    hidden_property_rubric:
      - "Defines R1/R2 with p95 target and quality constraint."
      - "Separates causes from interventions."
      - "Uses measurable latency components."
      - "Includes tradeoffs among latency, quality, cost, and reliability."
      - "Prunes based on contribution to p95 and ease of measurement."
    common_traps:
      - "Immediately suggests a smaller model."
      - "Ignores retrieval/tool latency."
      - "Fails to preserve quality target."
    grading_rule: "Reward diagnostic instrumentation and decision criteria."

  - id: minto_eval_009_policy_homelessness_program
    type: novel_stress_test
    visible_prompt: "A city is considering a new homelessness intervention after unsheltered counts rose despite higher spending. Officials disagree whether the issue is housing supply, behavioral health, shelter operations, enforcement, or measurement. Build an issue tree and evidence plan."
    hidden_reference_logic: "Frame the gap between spending and outcomes. Separate measurement validity, inflow/outflow dynamics, housing capacity, service effectiveness, operations, and enforcement/policy constraints. Avoid moralized or purely political branches."
    hidden_property_rubric:
      - "Defines the undesired and desired results."
      - "Includes measurement reliability as an early branch."
      - "Uses inflow/outflow or system-flow logic."
      - "Separates root causes from intervention levers."
      - "Specifies evidence needed and stakeholder constraints."
    common_traps:
      - "Ideological list."
      - "No population-flow model."
      - "Treats spending as equivalent to service capacity."
    grading_rule: "Reward system structure, evidence discipline, and policy-relevant pruning."

  - id: minto_eval_010_research_claim_replication
    type: novel_stress_test
    visible_prompt: "A research team reports a surprising effect in a small study. A funder wants to know whether to invest in a larger replication and follow-on program. Build an issue tree for evaluating the claim."
    hidden_reference_logic: "Use abductive reasoning. Ask whether the observed result is real, whether the proposed mechanism explains it, whether alternatives have been excluded, and whether replication would be decisive and worth funding."
    hidden_property_rubric:
      - "States the decision question."
      - "Separates evidence quality, effect size, mechanism, confounds, external validity, and replication design."
      - "Frames tests as confirm/exclude questions."
      - "Includes decision criteria for funding."
      - "Avoids treating publication as proof."
    common_traps:
      - "Generic literature review tree."
      - "No falsification logic."
      - "Ignores base rates and power."
    grading_rule: "Reward clear hypothesis-testing structure and experiment design criteria."
