[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keystone-intelligence-engine"
version = "0.1.0"
description = "Multi-agent AI system for automated consulting research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Jack Riddle"},
]

dependencies = [
    # Core
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",

    # Storage (HITL database)
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",

    # Web / API (HITL REST endpoints)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "tenacity>=8.2.0",


    # LLM provider
    "openai>=1.60.0",
    "pydantic-ai>=1.77.0",
]

# Dependencies to add back when the corresponding components are built:
# "mcp>=1.0.0"              -- Component #4 Phase 1B (real MCP server connections)
# "exa-py>=1.0.0"           -- Component #3a or #7 (Exa search API)
# "temporalio>=1.7.0"       -- Phase 2 (workflow orchestration)
# "pgvector>=0.3.0"         -- Component #3a (vector search)
# "asyncpg>=0.29.0"         -- Component #3a (PostgreSQL driver)
# "redis[hiredis]>=5.0.0"   -- Phase 2 (rate limiter backend)
# "docling>=2.0.0"          -- Component #3a (PDF parsing)
# "cohere>=5.0.0"           -- Component #3a (reranking)
# "alembic>=1.13.0"         -- Component #3a (migrations)

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5.0",
    "types-PyYAML",
    "types-redis",
    "pytest-httpx>=0.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/keystone"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "openai.*",
    "pydantic_ai.*",
    "temporalio.*",
    "exa_py.*",
    "pgvector.*",
    "mcp.*",
    "cohere.*",
    "docling.*",
]
ignore_missing_imports = true
# These overrides are pre-configured for packages that will be added
# back as components are built. Keeping them avoids mypy breakage
# when imports appear before the package is installed.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
